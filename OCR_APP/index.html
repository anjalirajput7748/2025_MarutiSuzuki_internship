<!DOCTYPE html>
<html>
<head>
  <title>OCR PDF Upload</title>
</head>
<body>
  <h2>Upload a PDF to Extract Text</h2>
  <form id="uploadForm" enctype="multipart/form-data">
    <input type="file" name="file" id="fileInput" accept=".pdf" required>
    <button type="submit">Upload</button>
  </form>
  <h3>Extracted Text:</h3>
  <pre id="result"></pre>

  <script>
    document.getElementById('uploadForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const file = document.getElementById('fileInput').files[0];
      const formData = new FormData();
      formData.append('file', file);

      fetch('http://127.0.0.1:5000/extract-text', {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('result').textContent = data.extracted_text || data.error;
      })
      .catch(error => {
        document.getElementById('result').textContent = 'Something went wrong: ' + error;
      });
    });
  </script>
</body>
</html>
